<header
  class="mb-8 flex flex-col gap-5 border-b border-slate-200 pb-6 sm:flex-row sm:items-end sm:justify-between md:mb-12 md:pb-8"
>
  <div>
    <p class="sst-etiqueta mb-2 tracking-[0.3em] text-marca">
      SST Digital
    </p>
    <h1 class="text-3xl font-black uppercase tracking-tight text-slate-900 md:text-5xl">
      Control Central
    </h1>
    <p class="mt-2 text-sm font-medium text-slate-500 md:text-base">
      Bienvenido, {{ autenticacion.usuarioActual()?.nombre_completo ?? 'Usuario' }}
    </p>
  </div>

  <div class="flex items-center justify-between gap-3 sm:justify-end">
    <div class="min-w-0 text-right">
      <p class="truncate text-sm font-bold text-slate-700">
        {{ autenticacion.usuarioActual()?.nombre_completo ?? 'Cargando perfil…' }}
      </p>
      <p class="sst-etiqueta text-[9px] text-marca">
        {{ nombreRol() }}
      </p>
    </div>
    <button
      type="button"
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-control border border-slate-200 bg-superficie text-slate-500 shadow-sm transition hover:border-red-100 hover:bg-red-50 hover:text-red-600"
      aria-label="Cerrar sesión"
      title="Cerrar sesión"
      (click)="cerrarSesion()"
    >
      <svg
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M10 17l5-5-5-5" />
        <path d="M15 12H3" />
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
      </svg>
    </button>
  </div>
</header>
