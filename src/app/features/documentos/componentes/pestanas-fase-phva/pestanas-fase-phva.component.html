<div
  class="flex flex-wrap gap-2 border-b border-slate-200 pb-3"
  role="tablist"
  aria-label="Fases del ciclo PHVA"
>
  <button
    *ngFor="let fase of fases"
    type="button"
    role="tab"
    class="rounded-full px-4 py-2 text-xs font-black uppercase tracking-widest transition"
    [class.bg-indigo-600]="fase === faseActiva"
    [class.text-white]="fase === faseActiva"
    [class.bg-slate-100]="fase !== faseActiva"
    [class.text-slate-600]="fase !== faseActiva"
    [attr.aria-selected]="fase === faseActiva"
    (click)="seleccionar(fase)"
  >
    {{ etiquetar(fase) }}
  </button>
</div>
