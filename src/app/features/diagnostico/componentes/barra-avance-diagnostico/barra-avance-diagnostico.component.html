<div class="space-y-2">
  <div class="flex items-baseline justify-between text-sm font-bold text-slate-700">
    <span>Avance</span>
    <span>{{ calificados }} / {{ total }}</span>
  </div>
  <div class="h-2 overflow-hidden rounded-full bg-slate-100" role="progressbar" [attr.aria-valuenow]="porcentaje" aria-valuemin="0" aria-valuemax="100" [attr.aria-label]="'Avance ' + calificados + ' de ' + total">
    <span class="block h-full rounded-full" [class]="completa ? 'bg-emerald-500' : 'bg-indigo-600'" [style.width.%]="porcentaje"></span>
  </div>
</div>
