<section class="space-y-3 border-t border-slate-200 pt-4">
  <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Evidencias</p>

  <div *appSiTieneRol="rolesEscritura">
    <div
      *ngIf="!readonly"
      class="rounded-2xl border-2 border-dashed px-4 py-5 text-center"
      [class.border-indigo-400]="arrastrando"
      [class.bg-indigo-50]="arrastrando"
      [class.border-slate-200]="!arrastrando"
      (dragover)="alArrastrarSobre($event)"
      (dragleave)="alSalirArrastre()"
      (drop)="alSoltar($event)"
    >
      <p class="text-sm font-semibold text-slate-600">Arrastra un PDF, JPEG o PNG (máx. 10 MB)</p>
      <label class="mt-3 inline-block cursor-pointer rounded-2xl bg-indigo-600 px-4 py-2 text-[10px] font-black uppercase tracking-widest text-white">
        Seleccionar archivo
        <input
          class="sr-only"
          type="file"
          accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png"
          [disabled]="subiendo"
          (change)="alSeleccionar($event)"
        />
      </label>
    </div>
  </div>

  <p *ngIf="subiendo" class="text-xs text-slate-500">Subiendo archivo…</p>
  <p *ngIf="error" class="rounded-2xl bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>

  <ul *ngIf="evidencias.length > 0" class="space-y-2">
    <li *ngFor="let evidencia of evidencias" class="flex items-center justify-between gap-3 rounded-2xl bg-slate-50 px-3 py-2">
      <span class="truncate text-sm font-semibold text-slate-700">{{ evidencia.nombre_archivo }}</span>
      <button type="button" class="shrink-0 text-[10px] font-black uppercase tracking-widest text-indigo-600" (click)="abrir(evidencia)">
        Ver
      </button>
    </li>
  </ul>
</section>

<app-visor-evidencia [evidencia]="evidenciaEnVisor" (alCerrar)="cerrarVisor()" />
