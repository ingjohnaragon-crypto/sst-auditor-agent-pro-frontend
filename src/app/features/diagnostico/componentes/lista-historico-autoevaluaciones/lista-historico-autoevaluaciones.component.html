<p *ngIf="items.length === 0" class="text-sm text-slate-500" role="status">
  No hay autoevaluaciones para esta empresa.
</p>
<ul *ngIf="items.length > 0" class="space-y-3">
  <li *ngFor="let item of items; trackBy: trackItem">
    <button
      type="button"
      class="w-full rounded-[2rem] border border-slate-100 bg-white p-5 text-left shadow-sm transition hover:border-indigo-200"
      (click)="alVerDetalle.emit(item.id)"
    >
      <p class="text-sm font-black text-slate-800">{{ item.fecha }}</p>
      <p class="mt-1 text-xs uppercase tracking-widest text-slate-400">{{ etiquetaEstado(item) }}</p>
      <p *ngIf="item.puntaje_total !== null" class="mt-2 font-mono text-lg font-black text-indigo-600">
        {{ item.puntaje_total }} %
      </p>
    </button>
  </li>
</ul>
