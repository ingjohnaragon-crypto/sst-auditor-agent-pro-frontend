<article class="space-y-4 rounded-[2rem] border-2 p-4 md:p-6" [ngClass]="clasesTarjeta">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="mb-2 flex flex-wrap items-center gap-2">
        <span class="font-mono text-sm font-black text-indigo-600">{{ estandar.numeral }}</span>
      </div>
      <p class="text-sm font-bold leading-relaxed text-slate-800">{{ estandar.descripcion }}</p>
    </div>
    <p class="shrink-0 font-mono text-sm font-black text-slate-500">{{ estandar.valor_porcentual }} %</p>
  </div>

  <div class="grid grid-cols-3 gap-2">
    <button
      *ngFor="let resultado of resultados"
      type="button"
      [class]="clasesBoton(resultado)"
      [disabled]="readonly || guardando"
      (click)="seleccionar(resultado)"
    >
      {{ etiquetas[resultado] }}
    </button>
  </div>

  <label class="block text-xs font-semibold text-slate-600">
    Observaciones
    <textarea
      class="sst-campo mt-2 min-h-20 w-full rounded-2xl p-3 text-sm"
      [value]="observaciones"
      [disabled]="readonly || guardando"
      (input)="alEscribirObservaciones($any($event.target).value)"
    ></textarea>
  </label>
</article>
