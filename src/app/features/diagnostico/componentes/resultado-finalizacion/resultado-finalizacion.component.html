<section class="rounded-[2rem] border border-indigo-100 bg-indigo-50 p-6 md:p-8">
  <p class="sst-etiqueta mb-2 text-indigo-500">Resultado</p>
  <p class="font-mono text-5xl font-black text-indigo-600">{{ puntajeTotal ?? '—' }} %</p>
  <p *ngIf="requierePlanMejora" class="mt-3 text-sm font-semibold text-amber-800">
    Requiere plan de mejora (umbral 85 %).
  </p>
  <p *ngIf="!requierePlanMejora && puntajeTotal !== null" class="mt-3 text-sm font-semibold text-emerald-800">
    Cumple el umbral de la Res. 0312.
  </p>
</section>
