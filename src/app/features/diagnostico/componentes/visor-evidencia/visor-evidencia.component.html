<div
  *ngIf="evidencia"
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4"
  role="dialog"
  aria-modal="true"
  aria-label="Visor de evidencia"
>
  <div class="flex max-h-[90vh] w-full max-w-4xl flex-col gap-3 rounded-[2rem] bg-white p-4 shadow-xl">
    <div class="flex items-center justify-between gap-3">
      <p class="truncate text-sm font-bold text-slate-800">{{ evidencia.nombre_archivo }}</p>
      <button type="button" class="rounded-2xl px-3 py-2 text-xs font-black uppercase tracking-widest text-slate-500" (click)="cerrar()">
        Cerrar
      </button>
    </div>
    <p *ngIf="cargando" class="text-sm text-slate-500">Abriendo el documento…</p>
    <p *ngIf="error" class="rounded-2xl bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error }}</p>
    <iframe
      *ngIf="urlPdf && esPdf"
      class="min-h-[60vh] w-full rounded-2xl border border-slate-200"
      [title]="evidencia.nombre_archivo"
      [src]="urlPdf"
    ></iframe>
    <img
      *ngIf="url && esImagen"
      class="max-h-[70vh] w-full rounded-2xl object-contain"
      [alt]="evidencia.nombre_archivo"
      [src]="url"
    />
  </div>
</div>
