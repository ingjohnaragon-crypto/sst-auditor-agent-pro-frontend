<section class="space-y-3">
  <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Cargar documento</p>

  <div
    class="rounded-2xl border-2 border-dashed px-4 py-5 text-center"
    [class.border-indigo-400]="arrastrando"
    [class.bg-indigo-50]="arrastrando"
    [class.border-slate-200]="!arrastrando"
    [class.opacity-60]="deshabilitado || subiendo"
    (dragover)="alArrastrarSobre($event)"
    (dragleave)="alSalirArrastre()"
    (drop)="alSoltar($event)"
  >
    <p class="text-sm font-semibold text-slate-600">Arrastra un PDF, JPEG o PNG (máx. 10 MB)</p>
    <label
      class="mt-3 inline-block cursor-pointer rounded-2xl bg-indigo-600 px-4 py-2 text-[10px] font-black uppercase tracking-widest text-white"
      [class.pointer-events-none]="deshabilitado || subiendo"
    >
      Seleccionar archivo
      <input
        class="sr-only"
        type="file"
        accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png"
        [disabled]="deshabilitado || subiendo"
        (change)="alCambiarInput($event)"
      />
    </label>
  </div>

  <p *ngIf="subiendo" class="text-xs text-slate-500">Subiendo archivo…</p>
  <p *ngIf="error" class="rounded-2xl bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">
    {{ error }}
  </p>
</section>
