<main class="mx-auto max-w-7xl space-y-6">
  <header>
    <p class="sst-etiqueta">Repositorio documental</p>
    <h1 class="mt-2 text-3xl font-black tracking-tight text-slate-900">Archivos de la empresa</h1>
    <p class="mt-2 max-w-3xl text-sm text-slate-600">
      Lista, carga y descarga documentos vía el API. El navegador no habla con el bucket ni recibe
      credenciales de almacenamiento.
    </p>
  </header>

  <app-alerta
    *ngIf="!puedeEscribir"
    tipo="informativa"
    mensaje="Tu rol es de consulta. Puedes listar y descargar, pero no cargar ni eliminar archivos."
  />
  <app-alerta
    *ngIf="mensajeError"
    tipo="error"
    titulo="No fue posible completar la operación"
    [mensaje]="mensajeError"
    [cerrable]="true"
    (alCerrar)="mensajeError = ''"
  />
  <app-alerta
    *ngIf="mensajeExito"
    tipo="exito"
    [mensaje]="mensajeExito"
    [cerrable]="true"
    (alCerrar)="mensajeExito = ''"
  />

  <section class="rounded-panel border border-slate-200 bg-white p-5 shadow-sm">
    <label for="empresa-archivos" class="block text-sm font-bold text-slate-800">Empresa</label>
    <div class="mt-2 flex flex-col gap-3 sm:flex-row">
      <select
        id="empresa-archivos"
        [(ngModel)]="empresaSeleccionadaId"
        class="min-h-11 flex-1 rounded-control border border-slate-300 bg-white px-3 py-2 text-sm focus:border-marca focus:outline-none focus:ring-2 focus:ring-indigo-100"
        [disabled]="cargandoEmpresas"
        (ngModelChange)="seleccionarEmpresa()"
      >
        <option value="">Selecciona una empresa</option>
        <option *ngFor="let empresa of empresas; trackBy: trackEmpresa" [value]="empresa.id">
          {{ empresa.razon_social }} — {{ empresa.nit }}
        </option>
      </select>
      <app-boton
        variante="secundario"
        [deshabilitado]="!empresaSeleccionadaId"
        [cargando]="cargandoLista"
        (alHacerClic)="cargarLista()"
      >
        Actualizar listado
      </app-boton>
    </div>
    <p *ngIf="!cargandoEmpresas && empresas.length === 0" class="mt-3 text-sm text-slate-500">
      No hay empresas disponibles.
    </p>
  </section>

  <section
    *ngIf="!empresaSeleccionadaId"
    class="rounded-panel border border-dashed border-slate-300 bg-slate-50 px-6 py-14 text-center"
  >
    <p class="text-sm font-semibold text-slate-600">Selecciona una empresa para ver sus archivos.</p>
  </section>

  <ng-container *ngIf="empresaSeleccionadaId">
    <app-zona-carga-archivo
      *ngIf="puedeEscribir"
      [subiendo]="subiendo"
      [error]="errorCarga"
      (alSeleccionarArchivo)="alSeleccionarArchivo($event)"
    />

    <p *ngIf="cargandoLista" class="text-sm text-slate-500">Cargando archivos…</p>

    <app-lista-archivos
      *ngIf="!cargandoLista"
      [archivos]="archivos"
      [puedeEscribir]="puedeEscribir"
      [descargandoId]="descargandoId"
      [eliminandoId]="eliminandoId"
      (alDescargar)="descargar($event)"
      (alEliminar)="eliminar($event)"
    />
  </ng-container>
</main>
