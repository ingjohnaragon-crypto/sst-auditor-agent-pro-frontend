<section class="w-full max-w-lg rounded-panel bg-white p-6 shadow-2xl" role="dialog" aria-modal="true" [attr.aria-label]="titulo || 'Ventana de diálogo'">
  <header class="mb-4 flex items-start justify-between gap-4">
    <h2 *ngIf="titulo" class="text-lg font-bold text-slate-900">{{ titulo }}</h2>
    <button *ngIf="cerrable" type="button" class="ml-auto rounded p-1 text-slate-500 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500" aria-label="Cerrar ventana" (click)="cerrar()">×</button>
  </header>
  <div><ng-content></ng-content></div>
</section>
