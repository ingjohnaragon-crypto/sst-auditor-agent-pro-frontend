<ng-container *ngIf="visible">
  <div
    *ngIf="esBloqueante; else panelInline"
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="idTitulo"
    aria-busy="true"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <div
      class="absolute inset-0 bg-slate-900/40"
      data-testid="loader-backdrop"
      (click)="cancelar()"
      aria-hidden="true"
    ></div>
    <ng-container *ngTemplateOutlet="contenidoPanel"></ng-container>
  </div>

  <ng-template #panelInline>
    <div class="relative" data-testid="loader-inline" aria-busy="true">
      <ng-container *ngTemplateOutlet="contenidoPanel"></ng-container>
    </div>
  </ng-template>

  <ng-template #contenidoPanel>
    <div
      class="sst-superficie relative z-10 w-full max-w-md p-6 shadow-xl"
      data-testid="loader-panel"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start gap-4">
        <span
          class="mt-0.5 inline-flex h-8 w-8 shrink-0 items-center justify-center"
          aria-hidden="true"
        >
          <span
            class="h-7 w-7 animate-spin rounded-full border-2 border-marca border-r-transparent"
          ></span>
        </span>
        <div class="min-w-0 flex-1">
          <h2 [id]="idTitulo" class="text-base font-black text-slate-800">
            {{ titulo }}
          </h2>
          <p *ngIf="mensaje" class="mt-1 text-sm text-slate-500">{{ mensaje }}</p>
        </div>
      </div>

      <div
        *ngIf="progreso !== null"
        class="mt-5"
        role="progressbar"
        [attr.aria-valuenow]="progreso"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-label]="titulo"
      >
        <div class="h-2 overflow-hidden rounded-full bg-slate-100">
          <div
            class="h-full rounded-full bg-marca transition-[width] duration-300"
            [style.width.%]="progreso"
            data-testid="loader-barra"
          ></div>
        </div>
        <p class="mt-1 text-right text-xs font-semibold text-slate-500">{{ progreso }}%</p>
      </div>

      <ul *ngIf="pasos.length > 0" class="mt-5 space-y-2" role="list">
        <li
          *ngFor="let paso of pasos; trackBy: trackPorId"
          class="flex items-start gap-2 rounded-control px-2 py-1.5 text-sm"
          [class.bg-indigo-50]="paso.estado === 'activo'"
          [class.text-slate-800]="paso.estado === 'activo'"
          [class.text-slate-400]="paso.estado === 'pendiente'"
          [class.text-emerald-700]="paso.estado === 'completado'"
          [class.text-red-600]="paso.estado === 'error'"
          role="listitem"
          [attr.data-estado]="paso.estado"
        >
          <span class="mt-0.5 w-4 shrink-0 text-center font-bold" aria-hidden="true">
            <ng-container [ngSwitch]="paso.estado">
              <span *ngSwitchCase="'completado'">✓</span>
              <span *ngSwitchCase="'error'">!</span>
              <span *ngSwitchCase="'activo'">●</span>
              <span *ngSwitchDefault>○</span>
            </ng-container>
          </span>
          <span>
            <span class="font-semibold">{{ paso.etiqueta }}</span>
            <span *ngIf="paso.detalle" class="mt-0.5 block text-xs opacity-80">{{
              paso.detalle
            }}</span>
          </span>
        </li>
      </ul>

      <div class="sr-only" aria-live="polite">{{ textoAnuncio }}</div>

      <div *ngIf="cancelable" class="mt-6 flex justify-end">
        <app-boton variante="secundario" tamano="sm" (alHacerClic)="cancelar()">
          {{ etiquetaCancelar }}
        </app-boton>
      </div>
    </div>
  </ng-template>
</ng-container>
