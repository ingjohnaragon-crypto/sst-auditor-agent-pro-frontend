<input
  class="sst-campo w-full px-3 py-2 text-sm text-slate-900"
  type="number"
  [id]="idControl"
  [attr.aria-describedby]="idDescripcion || null"
  [placeholder]="placeholder"
  [min]="min ?? null"
  [max]="max ?? null"
  [step]="step ?? null"
  [disabled]="deshabilitado"
  [value]="valor ?? ''"
  (input)="alCambiar(($any($event.target)).value)"
  (blur)="alBlur()"
/>
