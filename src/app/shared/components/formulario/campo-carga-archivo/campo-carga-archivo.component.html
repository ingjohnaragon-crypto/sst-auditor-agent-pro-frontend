<div class="flex flex-col gap-2">
  <input
    #entradaArchivo
    class="block w-full text-sm text-slate-700 file:mr-3 file:rounded-control file:border-0 file:bg-marca file:px-3 file:py-2 file:text-xs file:font-bold file:uppercase file:tracking-wide file:text-white"
    type="file"
    [id]="idControl"
    [attr.aria-describedby]="idDescripcion || null"
    [accept]="aceptar || null"
    [multiple]="multiple"
    [disabled]="deshabilitado"
    (change)="alCambiar($event)"
  />
  <ul *ngIf="nombres.length > 0" class="text-xs text-slate-500">
    <li *ngFor="let nombre of nombres">{{ nombre }}</li>
  </ul>
</div>
