<div
  class="sst-campo flex min-h-11 flex-wrap items-center gap-2 px-3 py-2"
  [class.opacity-50]="deshabilitado"
>
  <span
    *ngFor="let chip of valor; let i = index"
    class="inline-flex items-center gap-1 rounded-full bg-indigo-50 px-2 py-1 text-xs font-semibold text-marca"
  >
    {{ chip }}
    <button
      type="button"
      class="rounded p-0.5 hover:bg-indigo-100 focus:outline-none focus:ring-2 focus:ring-marca"
      [attr.aria-label]="'Quitar ' + chip"
      [disabled]="deshabilitado"
      (click)="quitarChip(i)"
    >
      ×
    </button>
  </span>
  <input
    class="min-w-[8rem] flex-1 border-0 bg-transparent text-sm text-slate-900 outline-none"
    type="text"
    [id]="idControl"
    [placeholder]="placeholder || 'Escribe y pulsa Enter'"
    [disabled]="deshabilitado"
    [value]="borrador"
    (input)="borrador = ($any($event.target)).value"
    (keydown)="alTecla($event)"
    (blur)="alBlur()"
  />
</div>
